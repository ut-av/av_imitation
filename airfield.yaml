kind: package
name: av_imitation
dependencies:
- rclpy
- rosbag2_py
- cv_bridge
- sensor_msgs
- geometry_msgs
- std_msgs
- builtin_interfaces
- amrl_msgs
- ut_automata
- ackermann_msgs
- python3-flask
- python3-opencv
- python3-numpy
# GPU builds, resolved by project-local recipes in dependencies/arm64/ that
# shadow the shared recipe book (airfield checks the project first). The shared
# `torch`/`onnxruntime` recipes install CPU-only wheels, which on the Orin leave
# training, ONNX export and inference running on the CPU or failing outright.
- torch
- onnxruntime
- tensorboard
source_path: .
ros_distro: jazzy
