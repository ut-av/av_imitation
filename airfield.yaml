kind: package
name: av_imitation
# The ROS dependencies come from package.xml, which airfield reads at build
# time. Only the GPU ML stack is listed here, because package.xml can't express
# it: these are resolved by project-local recipes in dependencies/arm64/ (torch,
# onnxruntime) and dependencies/xplatform/ (tensorboard) that shadow the shared
# recipe book (airfield checks the project first). The shared `torch`/
# `onnxruntime` recipes install CPU-only wheels, which on the Orin leave
# training, ONNX export and inference running on the CPU or failing outright.
dependencies:
- torch
- onnxruntime
- tensorboard
source_path: .
ros_distro: jazzy
